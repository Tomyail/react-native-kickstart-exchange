# git-cliff configuration for Conventional Commit releases.
# https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n\nAll notable changes to this project are documented here.\n"
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true
footer = """
{% if previous and current %}
**Full Changelog**: https://github.com/Tomyail/react-native-kickstart-exchange/compare/{{ previous }}...{{ current }}
{% endif %}
"""

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
topo_order = true
topo_order_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🚜 Refactor" },
  { message = "^docs?", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^build|^ci|^chore", group = "⚙️ Maintenance" },
  { message = "^revert", group = "◀️ Reverts" },
  { message = "BREAKING CHANGE", group = "💥 Breaking Changes" },
  { message = ".*", group = "💼 Other" },
]
